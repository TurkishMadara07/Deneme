{n:"Türkçe",e:"📖",L:[
["Sözcükte anlam","Sözcük bağlama göre anlam kazanır: <b>gerçek</b> (temel), <b>yan</b> (benzerlikle), <b>mecaz</b> (gerçek anlamından uzaklaşmış). <b>Terim anlam:</b> bilim ya da meslek alanına özgü (kök, matematikte). <b>Deyim:</b> en az iki sözcük, mecaz, kalıplaşmış (burnu havada). <b>Atasözü:</b> öğüt verir, genel yargı bildirir. <b>Eş sesli:</b> yazılışı ve sesi aynı, anlamı farklı (yüz)."],
["Cümlede anlam","Cümleyi yorumlarken <b>neden-sonuç</b> (çünkü, bu yüzden), <b>amaç-sonuç</b> (diye, için), <b>koşul</b> (-se), <b>karşılaştırma</b>, <b>ek bilgi</b>, <b>karşıtlık</b> (ama, fakat) ilişkilerini ara.<br><b>Öznel yargı</b> kişiden kişiye değişir (güzel, en iyi); <b>nesnel yargı</b> kanıtlanabilir (Ankara başkenttir)."],
["Paragraf","<b>Konu:</b> neyden söz ediliyor. <b>Ana düşünce:</b> yazarın vermek istediği asıl mesaj (çoğu zaman son cümle). <b>Yardımcı düşünce:</b> ana düşünceyi destekler.<br>Soru tipleri: boş bırakılan yeri tamamlama, paragrafı ikiye ayırma (bakış açısı değişen yer), anlatım akışını bozan cümle (konudan sapan).<br><i>İpucu: her cümleyi tek kelimeyle özetle.</i>"],
["Destan dönemi şiiri (İslamiyet öncesi)","Sözlü edebiyattır. Türler: <b>sagu</b> (ağıt, ölüm), <b>sav</b> (atasözü, özdeyiş), <b>koşuk</b> (doğa, aşk, sevinç), <b>destan</b> (kahramanlık, olağanüstü olaylar).<br>Destanlar: Saka → Alp Er Tunga, Şu • Hun → Oğuz Kağan • Göktürk → Bozkurt, Ergenekon • Uygur → Türeyiş, Göç. Doğal destanlar anonimdir."],
["Halk şiiri: koşma, türkü, mani","<b>Koşma:</b> 11’li hece ölçüsü, genelde dörtlüklerle, aşk, doğa, güzellik konulu. <b>Türkü:</b> anonim, ezgiyle söylenir, yöreye göre değişir. <b>Mani:</b> 7’li hece, dört dizelik, uyak düzeni aaxa. <b>Ağıt:</b> ölüm acısı. <b>Ninni:</b> çocuk uyutmak için."],
["Masal","Hayal ürünüdür; olağanüstü kişi ve olaylar bulunur (dev, peri). Zaman ve mekân belirsizdir (“Evvel zaman içinde, kalbur saman içinde”). İyi–kötü çatışması vardır, genelde iyi kazanır. Kahramanlar tiptir; anonim ve sözlü başlar."],
["Şiirde ahenk","<b>Uyak (kafiye):</b> dize sonlarındaki ses benzerliği. <b>Redif:</b> uyaktan sonra gelen aynı sözcük ya da ek. <b>Aliterasyon:</b> aynı ünsüzün tekrarı. <b>Asonans:</b> aynı ünlünün tekrarı. Uyak düzeni harflerle gösterilir (aaba, abab)."],
["Tamlamalar","<b>Sıfat tamlaması:</b> sıfat + isim (kırmızı elma, üç kitap, bu ev). Sıfat soruları: nasıl? kaç? hangi? Tamlanan ek almaz.<br><b>Belirtili isim tamlaması:</b> tamlayan -ın/-in, tamlanan -ı/-i (okulun bahçesi). <b>Belirtisiz:</b> tamlayan ek almaz (okul bahçesi).<br><i>İpucu: sıfat tamlamasında tamlanan ek almaz, isim tamlamasında ek alır.</i>"],
["Yazım ve noktalama","<b>de/da bağlaç</b> ayrı yazılır (Sen de gel); bulunma eki bitişiktir (evde). <b>ki bağlaç</b> ayrı yazılır. <b>mi</b> ayrı yazılır. Kesme işareti özel isimlere gelen ekleri ayırır (Ali’nin). Virgül sıralı öğeleri ayırır; cümle noktayla biter; cümle büyük harfle başlar."]],
q:[["‘Sözleri yüreğimi yaktı.’ cümlesindeki ‘yaktı’ hangi anlamdadır?",["Gerçek","Mecaz","Terim","Eş sesli"],1,"Söz gerçekten ateşle yakmaz; duygusal bir etki anlatılır. Bu yüzden mecaz anlamdadır."],
["Hangisi deyimdir?",["Damlaya damlaya göl olur.","Ağzı kulaklarına varmak","Sabreden derviş muradına ermiş.","Ayağını yorganına göre uzat."],1,"Deyim mecaz anlamlı kalıptır, öğüt vermez. Diğerleri atasözüdür; öğüt ya da genel yargı bildirir."],
["‘Çalışmadığı için sınavdan düşük aldı.’ cümlesinde hangi ilişki vardır?",["Amaç-sonuç","Neden-sonuç","Koşul","Karşılaştırma"],1,"“-dığı için” bir neden bildirir, düşük not sonuçtur. Amaç-sonuçta eylem bir amaç uğruna yapılır."],
["Hangisi nesnel yargıdır?",["Ankara Türkiye’nin başkentidir.","Bu manzara çok güzel.","En lezzetli yemek mantıdır.","Müzik en iyi dinlenme yoludur."],0,"Başkent bilgisi kanıtlanabilir. Güzel, lezzetli ve en iyi kişiden kişiye değişen öznel yargılardır."],
["“Kitap okumak yalnızca zaman geçirmek değildir. Okuyan insan farklı hayatları tanır, kelime dağarcığını geliştirir ve düşünme becerisini güçlendirir. Bu yüzden okumak kişiyi hayata hazırlayan bir alışkanlıktır.” Ana düşünce hangisidir?",["Kitaplar pahalıdır.","Okumak kişiyi geliştiren, hayata hazırlayan bir alışkanlıktır.","Kelime öğrenmek zordur.","Okumak zaman geçirme yoludur."],1,"Ana düşünce, paragrafın son cümlesinde ve “bu yüzden” bağlacından sonra toplanır. Diğerleri ya yoktur ya da metnin tersini söyler."],
["İslamiyet öncesi Türk edebiyatında ölüm üzerine söylenen ağıt türüne ne denir?",["Koşuk","Sagu","Sav","Destan"],1,"Sagu ağıttır. Koşuk doğa ve aşk, sav atasözü, destan kahramanlık konuludur."],
["Koşma hangi hece ölçüsüyle yazılır?",["7’li","8’li","11’li","14’lü"],2,"Koşma 11’li hece ölçüsüyle yazılır. Mani 7’li hecelidir."],
["Hangisi sıfat tamlamasıdır?",["Okulun bahçesi","Kırmızı elma","Ali’nin kalemi","Okul bahçesi"],1,"Kırmızı elma: sıfat + isim, tamlanan ek almamış. Diğerleri isim tamlamasıdır."],
["‘Sessiz sokakta sarı sonbahar’ dizesinde hangi ahenk unsuru belirgindir?",["Redif","Aliterasyon","Asonans","Uyak"],1,"Aynı ünsüz olan s sesi tekrar ediliyor: aliterasyon. Asonans ünlü tekrarıdır."],
["Hangisi yanlış yazılmıştır?",["Sen de geliyor musun?","O da bizimle gelecek.","Bende gelirim. (ben de anlamında)","Ev de çok güzeldi."],2,"“Ben de” anlamındaki de bağlaçtır, ayrı yazılır: Ben de gelirim. Bitişik yazılan -de bulunma ekidir (bende = bende var)."]]},

{n:"Tarih",e:"🏰",L:[
["Türkistan’dan Türkiye’ye: genel çerçeve","Selçuklular Türkistan’dan Horasan’a, İran ve Irak’a, oradan Anadolu’ya ilerledi. Sırayla: <b>Dandanakan (1040)</b> Gazneliler • <b>Pasinler (1048)</b> Bizans-Gürcü • <b>Malazgirt (1071)</b> Bizans • <b>Miryokefalon (1176)</b> Bizans • <b>Kösedağ (1243)</b> Moğollar."],
["Pasinler Savaşı (1048)","Selçuklu ordusu (İbrahim Yınal komutasında), Doğu Anadolu’da Bizans-Gürcü ordusuyla savaştı. Selçuklu üstünlüğüyle bitti. Anadolu’ya Türk akınları hızlandı; Malazgirt’in yolunu açan ilk büyük mücadelelerdendir."],
["Malazgirt (1071)","Alparslan, Bizans İmparatoru Romen Diyojen’i yendi. Sonuç: Anadolu’nun kapıları Türklere açıldı, Türkmen akını hızlandı, Anadolu’da beylikler kuruldu. Süleymanşah 1075’te Anadolu Selçuklu Devleti’ni kurdu."],
["Haçlı Seferleri","1095’te Papa II. Urban, Clermont’ta Kudüs’ü “kurtarma” çağrısı yaptı. <b>Dini</b> (Kudüs, Papa’nın otoritesi), <b>ekonomik</b> (Doğu ticareti, zenginlik), <b>siyasi</b> (Bizans’ın yardım istemesi, feodal lordların toprak arzusu) sebepler vardı.<br>I. Haçlı Seferi sonunda Kudüs alındı (1099). Anadolu Selçuklu başkenti İznik’ten Konya’ya taşındı. Sonuç: İtalyan şehirleri (Venedik, Cenova) ticaretle güçlendi, feodalite zayıfladı; Selahaddin Eyyubi 1187’de Kudüs’ü geri aldı."],
["Miryokefalon ve Kösedağ","<b>Miryokefalon (1176):</b> II. Kılıç Arslan Bizans’ı yendi; Anadolu’da Türk yurdu kalıcılaştı.<br><b>Kösedağ (1243):</b> Moğollara yenilen Anadolu Selçuklu zayıfladı, Moğol baskısı arttı, beylikler güçlendi."],
["Türklerde devlet teşkilatı","<b>Hükümdar</b> yetkisini Tanrı’dan aldığına inanılırdı (kut). Danışma meclisi <b>kurultay</b>. Selçuklularda <b>divan</b> (Divan-ı Saltanat), <b>vezir</b> (Nizamülmülk) ve şehzadelerin eğitiminden sorumlu <b>atabey</b> vardı.<br>Ordu: ikta askerleri, saray muhafızı gulamlar, Türkmenler.<br>Bağımsızlık sembolleri: adına <b>hutbe okutmak</b> ve <b>sikke (para) bastırmak</b>."],
["İkta ve Nizamiye","<b>İkta:</b> görevliye maaş yerine bir bölgenin vergi geliri bırakılır; toprağın mülkiyeti devlette kalır. Amaç: orduyu beslemek, merkezi otoriteyi korumak.<br><b>Nizamiye medreseleri:</b> Nizamülmülk açtırdı; Sünni eğitimi yaymak, devlet adamı yetiştirmek amacı vardı."],
["Sosyoekonomik hayat","Türkmenler göçebe hayvancılık yapar; Selçuklular yerleşik düzeni ve tarımı da destekledi. Ticaret İpek Yolu üzerinden gelişti; <b>kervansaray ve hanlar</b> (Sultanhanı) yolları güvenli kıldı. Şehirler: Konya, Kayseri, Sivas. <b>Ahilik:</b> 13. yüzyıl Anadolu’sunda esnaf ve sanatkârı örgütleyen, ahlak ve dayanışma esasına dayanan teşkilat (Ahi Evran)."]],
q:[["Pasinler Savaşı (1048) hangi güçler arasında yapılmıştır?",["Selçuklu – Bizans/Gürcü","Selçuklu – Gazneli","Selçuklu – Moğol","Anadolu Selçuklu – Haçlı"],0,"Pasinler’de Selçuklular Doğu Anadolu’da Bizans-Gürcü ordusuyla çarpıştı. Gazneli ile savaş Dandanakan (1040), Moğolla savaş Kösedağ (1243)’tır."],
["Haçlı Seferleri’ni başlatan çağrıyı kim yapmıştır?",["Papa II. Urban","Romen Diyojen","Selahaddin Eyyubi","Alparslan"],0,"1095 Clermont’ta Papa II. Urban çağrı yaptı. Selahaddin Eyyubi, Haçlılarla savaşan Müslüman komutandır."],
["Haçlı Seferleri’nin sonuçlarından biri hangisidir?",["Feodal sistem güçlendi","İtalyan ticaret şehirleri zenginleşti","Anadolu Selçuklu yıkıldı","Papalık tamamen yıkıldı"],1,"Venedik ve Cenova gibi ticaret şehirleri taşımacılık ve ticaretle zenginleşti. Feodalite ise zayıfladı."],
["Selçuklularda şehzadelerin eğitiminden sorumlu görevli kimdir?",["Vezir","Atabey","Gulam","Kadı"],1,"Atabey, şehzadeyi eğiten ve yetiştiren görevlidir. Vezir ise devletin idari işlerini yürütür."],
["Hutbe okutmak ve para bastırmak neyin göstergesidir?",["Bağımsızlık (egemenlik)","Vergi toplamanın","Askerlik görevinin","Ticaretin gelişmesinin"],0,"Adına hutbe okutmak ve para bastırmak hükümdarın bağımsızlık sembolleridir."],
["13. yüzyıl Anadolu’sunda esnaf ve sanatkârı örgütleyen teşkilat hangisidir?",["İkta","Ahilik","Atabeylik","Kurultay"],1,"Ahilik, esnaf ve sanatkârı ahlak ve dayanışma çerçevesinde örgütlemiştir."],
["Kösedağ Savaşı’nın sonucu nedir?",["Moğol baskısı arttı, Anadolu Selçuklu zayıfladı","Bizans güçlendi","Büyük Selçuklu kuruldu","Malazgirt kazanıldı"],0,"1243’te Moğollara yenilen Anadolu Selçuklu zayıfladı; beylikler öne çıktı."]]},

{n:"Coğrafya",e:"🌍",L:[
["Olay, olgu, mekân","<b>Olay:</b> zamanla sınırlı, değişen (deprem, sel, yangın). <b>Olgu:</b> sürekli, kalıcı özellik (Akdeniz iklimi, dağlar). <b>Mekân:</b> olay ve olgunun gerçekleştiği yer. Coğrafi sorularda olay ve olgu mekânla ilişkilendirilir (deprem → fay hattı)."],
["CBS ve uzaktan algılama","<b>CBS:</b> farklı katmanları (yol, nüfus, iklim, arazi) tek haritada birleştirip analiz eder; şehir planlama, afet yönetimi, tarım. <b>Uzaktan algılama:</b> uydu ve uçaktan veri toplar (orman yangını, buzul erimesi, kentleşme). <b>GPS:</b> uydularla konum belirler."],
["Harita yapımı","Veri toplama: arazi gözlemi, ölçüm, anket, istatistik, uydu görüntüsü. Sonra veriler haritaya işlenir ve haritanın bileşenleri eklenir: <b>başlık, ölçek, yön oku, lejant (işaretler), koordinat ağı, kaynak</b>.<br>Ölçek: 1/25.000, 1/1.000.000’dan büyüktür (daha ayrıntılı, daha küçük alan)."],
["Levha tektoniği","Yerkabuğu levhalara bölünüdür ve hareket eder. <b>Iraksak sınır:</b> levhalar ayrılır, okyanus ortası sırt, yeni kabuk. <b>Yakınsak sınır:</b> çarpışma (dağ oluşumu) ya da dalma-batma (volkan, deprem). <b>Yanal (doğrultu atımlı) sınır:</b> levhalar yan yana kayar, fay ve deprem. Türkiye’de Kuzey Anadolu Fay Hattı yanal örnektir."],
["Aşınım ve birikim","<b>Akarsu:</b> vadi, kanyon (aşınım); delta, taşkın ovası (birikim). <b>Rüzgâr:</b> mantar kaya (aşınım); kum tepeleri (birikim). <b>Buzul:</b> sirk, U vadi, fiyort. <b>Dalga:</b> falez (aşınım); kumsal, kıyı oku (birikim). <b>Karstik (çözünme):</b> dolin, mağara, sarkıt-dikit."],
["Ayrışma, çözünme, iklim ve kayaç","Soğuk iklimde <b>don olayı</b>, sıcaklık farkı büyük çöllerde fiziksel ayrışma; nemli iklimde <b>kimyasal ayrışma/çözünme</b> (kalkerli arazide karstik). Kayaç sert mi yumuşak mı olduğu şekli belirler.<br><b>Peri bacası:</b> yumuşak tüfün üstünde sert bazalt/andezit başlık; yağış ve rüzgâr tüfü aşındırır (Kapadokya). <i>Animasyona bak.</i>"]],
q:[["Hangisi bir olgudur?",["Sel","Deprem","Akdeniz iklimi","Fırtına"],2,"Olgu sürekli ve kalıcıdır (iklim). Sel, deprem, fırtına belirli bir anda gerçekleşen olaylardır."],
["Uydu görüntüsüyle orman yangınının izlenmesi hangisinin kullanım alanıdır?",["Uzaktan algılama","Harita ölçeği","Lejant","Yön oku"],0,"Uydudan veri toplama uzaktan algılamadır. CBS ise bu verileri katmanlayıp analiz eder."],
["Haritadaki işaretlerin ne anlama geldiğini gösteren bölüm hangisidir?",["Ölçek","Lejant","Başlık","Yön oku"],1,"Lejant (işaretler) sembollerin açıklamasıdır."],
["Levhaların birbirinden uzaklaştığı sınırda ne oluşur?",["Dalma-batma","Okyanus ortası sırt ve yeni kabuk","Dağ sırası","Yanal kayma"],1,"Iraksak sınırda magma çıkar ve okyanus ortası sırt, yeni kabuk oluşur. Dağ oluşumu yakınsak sınırlarda görülür."],
["Kuzey Anadolu Fay Hattı hangi sınır türüne örnektir?",["Iraksak","Yakınsak","Yanal (doğrultu atımlı)","Dalma-batma"],2,"KAF’ta levhalar birbirine paralel kayar; bu yüzden deprem sık görülür."],
["Peri bacalarının oluşumunda kayaç yapısının rolü nedir?",["Hepsi aynı sertliktedir","Yumuşak tüf üstünde sert başlık bulunur","Sadece kalkerdir","Buzulla oluşur"],1,"Yumuşak tüf kolay aşınır; üstteki sert bazalt/andezit altını korur. Böylece koni biçimli peri bacası kalır."],
["Kalkerli arazide yeraltı suyunun çözmesiyle oluşan şekil hangisidir?",["Delta","Mağara","Falez","Kum tepesi"],1,"Karstik şekiller (dolin, mağara, sarkıt) kalkerin suda çözünmesiyle oluşur. Falez dalga, delta akarsu, kum tepesi rüzgâr şeklidir."]]},

{n:"Felsefe",e:"💭",L:[
["Felsefe nedir?","Yunanca <b>philosophia</b> = philo (sevgi) + sophia (bilgelik): <b>bilgelik sevgisi</b>. Felsefe varlık, bilgi ve değer üzerine sorgulayarak düşünmedir. Cevaplardan çok <b>sorular</b> önemlidir; felsefi sorular ucu açık, evrensel ve gerekçelendirmeye dayanır."],
["Felsefi düşüncenin özellikleri","<b>Sorgulayıcı</b> (neden?), <b>eleştirel</b> (kanıt ve gerekçe ister), <b>akla dayanır</b>, <b>tutarlıdır</b> (kendi içinde çelişmez), <b>bütüncüldür</b> (parçayı değil bütünü görmeye çalışır), <b>evrenseldir</b>.<br>Bilimden farkı: bilim gözlem ve deneyle, felsefe akıl yürütmeyle ilerler."],
["Felsefenin ortaya çıkışı ve dönemleri","MÖ 6. yüzyılda İyonya’da (Miletos) <b>Thales</b> ile başladı: mitten (efsane) <b>logosa</b> (akıl) geçiş. Dönemler: <b>İlkçağ</b> (Sokrates, Platon, Aristoteles) → <b>Ortaçağ</b> (Hristiyan ve İslam felsefesi: Farabi, İbn Sina) → <b>Yeniçağ</b> (Rönesans, Descartes, Bacon) → <b>Aydınlanma</b> (Kant) → 19.-20. yüzyıl. Batı felsefesinin yanında Hint ve Çin gelenekleri de vardır."],
["Mantık ve argümantasyon","<b>Önerme:</b> doğru ya da yanlış denebilen yargı cümlesidir (soru, emir, ünlem önerme değildir).<br><b>Argüman:</b> öncüller + sonuç. <b>Tümdengelim:</b> genelden özele, sonuç zorunlu. <b>Tümevarım:</b> özelden genele, sonuç olasıdır.<br><b>Geçerli:</b> sonuç öncüllerden zorunlu çıkar. Örnek: İnsan ölümlüdür; Sokrates insandır; Sokrates ölümlüdür."]],
q:[["‘Felsefe’ sözcüğünün kökenindeki anlam hangisidir?",["Bilgelik sevgisi","Doğa bilimi","Din bilgisi","Sanat anlayışı"],0,"Yunanca philosophia: philo (sevgi) + sophia (bilgelik)."],
["Hangisi önerme değildir?",["Dünya yuvarlaktır.","Kapıyı kapat.","Ankara Türkiye’nin başkentidir.","2 + 2 = 5"],1,"Emir cümlesi doğru ya da yanlış olarak değerlendirilemez. “2+2=5” yanlıştır ama önermedir."],
["Felsefenin ortaya çıktığı yer ve ilk filozof hangisidir?",["İyonya – Thales","Atina – Platon","Roma – Seneca","Mısır – Hermes"],0,"MÖ 6. yy’da İyonya’da (Miletos) Thales, doğayı mitlere değil akla dayanarak açıklamaya çalıştı."],
["Genelden özele giden akıl yürütmeye ne denir?",["Tümevarım","Tümdengelim","Analoji","Gözlem"],1,"Tümdengelim genelden özele gider. Tümevarım özelden genele gider."],
["Felsefi düşünce için hangisi doğrudur?",["Kesin, değişmez cevaplar verir","Sorgulayıcı ve eleştireldir","Yalnızca deneyle kanıtlanır","Dogmatiktir"],1,"Felsefe, sorgulama ve eleştiriye dayanır. Yalnızca deneyle kanıtlama bilimin yöntemidir."]]},

["Bilgi ve ilim","İslam’da bilgi (ilim) çok önemlidir. Kur’an’ın ilk inen ayeti <b>“Oku”</b> emriyle başlar. Bilgi; <b>zan</b> (kesin olmayan) ve <b>şüpheden</b> ayrılır. İlim, amelle (davranışla) birlikte değer kazanır."],
["Bilgi kaynakları","İslam düşüncesinde bilgi kaynakları: <b>duyu organları</b> (gözlem), <b>akıl</b> (muhakeme), <b>doğru haber</b> (güvenilir kaynaktan aktarılan bilgi), <b>vahiy</b> ve <b>ilham</b>."],
["Vahiy ve akıl","<b>Vahiy:</b> Allah’ın peygamberlerine, Cebrail aracılığıyla bildirdiği bilgi; Kur’an’dır. Akıl, vahyi anlamada araçtır; ama aklın sınırlı olduğu konular (ahiret gibi) vahiyle bilinir. Vahiy ve akıl <b>birbirini tamamlar</b>; Kur’an tefekkürü (düşünmeyi) teşvik eder."]],
q:[["Kur’an’ın ilk inen ayetinin emri nedir?",["Oku","Dua et","Yaz","Say"],0,"İlk ayet “Oku” emriyle başlar; bilgiye verilen önemi gösterir."],
